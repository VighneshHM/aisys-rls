name: CI

# Runs on every pull request and on pushes to main. Mirrors the engineering checks:
# formatter, linter + static analysis (ruff incl. bandit "S" rules), automated tests, dependency scan.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint + tests (Python ${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}      # the specification targets Windows 11 / Windows Server 2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        python: ["3.12", "3.13"]
        include:
          - os: windows-2022   # Windows Server 2022, the specification's server target
            python: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.lock
      - name: Install (exact versions and hashes from both lock files; the pinned setuptools builds the project)
        run: |
          python -m pip install --require-hashes -r requirements.lock -r requirements-dev.lock
          python -m pip install -e . --no-deps --no-build-isolation
      - name: Format check
        run: python -m ruff format --check .
      - name: Lint and static analysis
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy
      - name: Tests
        run: python -m pytest -q -n auto --durations=10
        env:
          SHELFSENSE_ENV: development

  lifecycle-demo:
    name: Offline install, update and rollback (real run)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.lock
      - run: |
          python -m pip install --require-hashes -r requirements.lock -r requirements-dev.lock
          python -m pip install -e . --no-deps --no-build-isolation
      - name: Real install, signed update, refusals and rollback (network blocked on the target-machine steps)
        run: python scripts/lifecycle_demo.py

  dependency-audit:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install pip-audit
      - name: Audit pinned dependencies (runtime, then development and build tools)
        run: |
          pip-audit -r requirements.lock --no-deps --disable-pip
          pip-audit -r requirements-dev.lock --no-deps --disable-pip
