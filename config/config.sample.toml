# Sample configuration (no secrets). Copy to config/config.toml and adjust.
# Secrets are NEVER stored here: set SHELFSENSE_SECRET_KEY in the environment.
# Override the file location with SHELFSENSE_CONFIG.

[app]
name = "ShelfSense"
environment = "development"      # development | production
host = "127.0.0.1"
port = 8000

[database]
url = "sqlite:///data/shelfsense.db"

[security]
session_ttl_minutes = 480
max_failed_logins = 5
lockout_minutes = 15

[logging]
level = "INFO"
format = "json"                  # json | text

[backup]
dir = "data/backups"          # pre-migration / pre-update database backups

# RFID devices. Each entry builds one adapter; "mock" is a built-in simulator. A real reader is a driver
# class registered in code (see src/shelfsense/rfid/registry.py) and selected here with driver = "<name>".
[[devices]]
id = "staff-1"
kind = "staff_reader"
driver = "mock"

[[devices]]
id = "handheld-1"
kind = "handheld"        # walks a shelf for inventory
driver = "mock"

[[devices]]
id = "card-printer-1"
kind = "card_printer"   # prints and encodes patron cards
driver = "mock"

[[devices]]
id = "gate-1"
kind = "gate"            # security gate at the exit
driver = "mock"

[[devices]]
id = "camera-1"
kind = "camera"          # CCTV camera that photographs alarms
driver = "mock"

# Library policy. The ILMS owns loan limits; fines over the limit stop circulation.
[circulation]
fine_limit_cents = 500
loan_days = 14
max_renewals = 2
max_loans = 5
fine_per_day_cents = 25          # 0.25 for each billable day late
grace_days = 1                   # whole days late that cost nothing
max_fine_per_loan_cents = 1000   # one loan never costs more than 10.00

# The ILMS connector. "mock" is a built-in simulator that answers in SIP2 wording.
# A real system is a class implementing CirculationConnector, registered in code and selected here.
[gate]
duplicate_window_s = 60          # the same tag alarming again within this many seconds is a duplicate
# Read every real gate this often while the application runs (0 = off). Simulator gates hand their passages over by
# themselves. Alternatively run `python -m shelfsense.cli gate-poll --every 2` as a separate process: one or the other.
poll_seconds = 2

# Notification channels. "mock" providers record what they would send. A real email, SMS or print service is a class
# implementing NotificationProvider, registered in code and selected here.
[notifications]
email = "mock"
sms = "mock"
print = "mock"
max_attempts = 3                 # delivery attempts before a message is marked failed
backoff_s = 60                   # wait before a retry grows with each failure (backoff_s x attempts so far)
# Patron reminders: a message one day before a loan is due and another on the due day (to the member's e-mail / phone).
reminders = true
remind_days_before = 1           # days before the due date for the first reminder (1 to 30)
# While the app runs, look for reminders and deliver queued messages this often. 0 = off (then run
# `python -m shelfsense.cli notify-dispatch --every 60` as a separate process, or schedule it).
auto_dispatch_seconds = 60

[ilms]
# driver = "mock" is the built-in stand-in. driver = "sip2" speaks the SIP2 protocol to a real ILMS (docs/sip2.md);
# to try it without one, run `python -m shelfsense.cli sip2-sim --port 6101 --user shelfsense --password demo`.
driver = "mock"
#endpoint = "192.168.1.50"       # host name or IP address of the ILMS server (needed by driver = "sip2")
#port = 6001                     # the SIP2 port of the ILMS server (needed by driver = "sip2")
#login = "shelfsense"                 # SIP2 login user; leave out if the ILMS needs no login
#institution = "LIBRARY"         # SIP2 institution id (field AO)
#location = "MAIN"               # SIP2 location code of this system (fields CP and AP)
#timeout_s = 5                   # seconds to wait for an answer (0.1 to 120)
#checksum = true                 # SIP2 error detection (sequence number and checksum); turn off only if the ILMS rejects it
# The login PASSWORD is never written here: set the environment variable SHELFSENSE_ILMS_PASSWORD instead.
retries = 2
backoff_s = 0.1

# The public catalogue search at /opac (no sign-in; shows titles, shelves and availability only).
[opac]
enabled = true
# Host names that serve ONLY the public catalogue, for public terminals (e.g. a DNS or hosts-file name pointing at this
# server). On these names there is no staff page, no sign-in and no session; staff use the normal name. Empty = none.
kiosk_hosts = []

# Net cataloguing: look a book up by ISBN in an outside catalogue. "mock" is a built-in synthetic set.
[netcat]
driver = "mock"

# Encrypted transport. Leave both empty to serve plain HTTP on localhost and put a TLS proxy in front (docs/deployment.md),
# or give the certificate and private key (PEM files, kept outside the repository) to serve HTTPS directly.
[server]
tls_certfile = ""
tls_keyfile = ""
