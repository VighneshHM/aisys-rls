[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aisys"
version = "0.1.0"
description = "RFID-enabled library integration layer (AISYS candidate exercise)"
license = "LicenseRef-AISYS-Candidate-Exercise"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.142.2",
  "uvicorn==0.54.0",
  "SQLAlchemy==2.1.3",
  "alembic==1.20.0",
  "Jinja2==3.1.6",
  "python-multipart==0.0.32",
  "openpyxl==3.1.5",
]

[project.optional-dependencies]
dev = ["cryptography==50.0.2", "pytest==9.1.1", "pytest-xdist==3.8.0", "httpx==0.28.1", "ruff==0.16.10"]

[project.scripts]
aisys = "aisys.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aisys = ["migrations/*.mako", "migrations/versions/*.py", "web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "req(*ids): requirement IDs (FR/NFR/AC) this test provides evidence for",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "aisys.deps.require"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S608"]
"src/aisys/devtools/*" = ["S311"]  # synthetic data, not cryptography
