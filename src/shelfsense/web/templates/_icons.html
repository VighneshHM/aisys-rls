{# Inline SVG icon macro (Lucide-style paths, no external assets) #}

{%- elif name == "book" %}<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5M9 7h6"/>
{%- elif name == "swap" %}<path d="M4 8h14l-3-3M20 16H6l3 3"/>
{%- elif name == "tag" %}<path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1"/>

{%- elif name == "alert" %}<circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/>
{%- elif name == "check" %}<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>
